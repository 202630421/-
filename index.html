<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 먹을 엽기떡볶이 메뉴 추천</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 480px;
            padding: 40px 28px;
            text-align: center;
        }

        .logo-tag {
            display: inline-block;
            background-color: #ffe0e0;
            color: #e60012;
            font-weight: 700;
            font-size: 14px;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            color: #111;
            margin-bottom: 8px;
            word-break: keep-all;
        }

        .subtitle {
            font-size: 15px;
            color: #666;
            margin-bottom: 28px;
        }

        .card {
            background-color: #fff8f8;
            border: 2px dashed #ffcccc;
            border-radius: 20px;
            padding: 24px 20px;
            margin-bottom: 28px;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .image-container {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background-color: #ffffff;
            box-shadow: 0 8px 16px rgba(230, 0, 18, 0.12);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            overflow: hidden;
            border: 4px solid #ffffff;
        }

        .image-container svg {
            width: 100px;
            height: 100px;
            transition: transform 0.3s ease;
        }

        .menu-name {
            font-size: 22px;
            font-weight: 800;
            color: #e60012;
            margin-bottom: 8px;
            word-break: keep-all;
        }

        .menu-desc {
            font-size: 14px;
            color: #555;
            line-height: 1.5;
            word-break: keep-all;
        }

        .btn {
            width: 100%;
            background-color: #e60012;
            color: #ffffff;
            border: none;
            border-radius: 16px;
            padding: 18px 24px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(230, 0, 18, 0.3);
            transition: all 0.2s ease;
            outline: none;
        }

        .btn:hover {
            background-color: #cc0010;
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(230, 0, 18, 0.4);
        }

        .btn:active {
            transform: translateY(1px);
            box-shadow: 0 4px 12px rgba(230, 0, 18, 0.2);
        }

        /* Shake animation when randomizing */
        .shake {
            animation: shakeAnim 0.5s ease-in-out;
        }

        @keyframes shakeAnim {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-5px, 0) rotate(-3deg); }
            40% { transform: translate(5px, 0) rotate(3deg); }
            60% { transform: translate(-3px, 0) rotate(-1deg); }
            80% { transform: translate(3px, 0) rotate(1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="logo-tag">🔥 동대문 엽기떡볶이 🔥</span>
        <h1>오늘 뭐 먹지?</h1>
        <p class="subtitle">결정장애를 해결해주는 엽떡 메뉴 추천기!</p>

        <div class="card" id="result-card">
            <div class="image-container" id="image-box">
                <!-- SVG Icon or Image -->
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="45" fill="#FFEBEB"/>
                    <path d="M30 65 C 35 75, 65 75, 70 65" stroke="#E60012" stroke-width="5" stroke-linecap="round"/>
                    <circle cx="38" cy="45" r="6" fill="#E60012"/>
                    <circle cx="62" cy="45" r="6" fill="#E60012"/>
                    <path d="M45 25 L50 15 L55 25 Z" fill="#E60012"/>
                </svg>
            </div>
            <div class="menu-name" id="menu-name">버튼을 눌러주세요!</div>
            <div class="menu-desc" id="menu-desc">오늘의 운명적인 엽떡 메뉴는 과연?</div>
        </div>

        <button class="btn" id="recommend-btn" onclick="recommendMenu()">
            오늘 먹을 엽기떡볶이 메뉴 추천
        </button>
    </div>

    <script>
        // SVG 데이터 및 메뉴 정보
        const menuList = [
            {
                name: "엽기떡볶이 (원조)",
                desc: "매콤달콤 화끈한 매운맛의 대명사! 중독성 최강의 시그니처 대표 메뉴.",
                svg: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#FFE5E5"/><path d="M25 55 Q50 85 75 55 Z" fill="#E60012"/><circle cx="50" cy="45" r="25" fill="#FFF066"/><path d="M35 40 Q50 30 65 40" stroke="#E60012" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`
            },
            {
                name: "마라엽기떡볶이",
                desc: "마라의 얼얼한 풍미와 엽떡의 매콤함이 어우러진 대세 인기 메뉴!",
                svg: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#FFE0B2"/><path d="M25 55 Q50 85 75 55 Z" fill="#D84315"/><circle cx="50" cy="45" r="22" fill="#FFF176"/><circle cx="40" cy="40" r="4" fill="#5D4037"/><circle cx="60" cy="48" r="5" fill="#5D4037"/></svg>`
            },
            {
                name: "로제엽기떡볶이",
                desc: "부드러운 크림과 매콤한 엽떡 소스의 완벽한 조화! 부드러운 매운맛.",
                svg: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#FFECB3"/><path d="M25 55 Q50 85 75 55 Z" fill="#FF7043"/><circle cx="50" cy="45" r="25" fill="#FFFFFF" opacity="0.8"/><path d="M30 45 Q50 35 70 45" stroke="#FF7043" stroke-width="5" fill="none"/></svg>`
            },
            {
                name: "마라로제엽기떡볶이",
                desc: "얼얼한 마라 + 부드러운 로제 + 쫄깃한 분모자의 완벽 조합 극상 메뉴!",
                svg: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#F8BBD0"/><path d="M25 55 Q50 85 75 55 Z" fill="#E91E63"/><circle cx="50" cy="45" r="22" fill="#FFF9C4"/><path d="M35 42 Q50 50 65 42" stroke="#D81B60" stroke-width="4" fill="none"/></svg>`
            },
            {
                name: "엽기닭볶음탕",
                desc: "진한 국물에 칼칼한 매운맛이 쏙 배어든 밥도둑 닭볶음탕!",
                svg: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#FFCCBC"/><path d="M25 55 Q50 85 75 55 Z" fill="#BF360C"/><circle cx="42" cy="42" r="10" fill="#D84315"/><circle cx="58" cy="45" r="12" fill="#D84315"/><path d="M35 35 Q50 25 65 35" stroke="#FFF" stroke-width="3" fill="none"/></svg>`
            },
            {
                name: "엽기오뎅",
                desc: "떡보다 오뎅을 좋아하는 분들을 위한 맞춤 메뉴! 풍부한 어묵의 감칠맛.",
                svg: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#FFEBEE"/><path d="M25 55 Q50 85 75 55 Z" fill="#E60012"/><rect x="35" y="30" width="10" height="30" rx="3" fill="#FFE082"/><rect x="55" y="25" width="10" height="35" rx="3" fill="#FFE082"/></svg>`
            },
            {
                name: "엽기반반",
                desc: "떡과 오뎅 황금 비율! 고민할 필요 없이 즐길 수 있는 최고의 선택.",
                svg: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#FFEBEE"/><path d="M25 55 Q50 85 75 55 Z" fill="#E60012"/><rect x="35" y="30" width="10" height="25" rx="3" fill="#FFE082"/><circle cx="58" cy="42" r="8" fill="#FFFFFF"/></svg>`
            },
            {
                name: "짜장엽기떡볶이",
                desc: "고소하고 진한 짜장 소스에 엽떡의 매콤함이 스며든 이색 조합!",
                svg: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#E0E0E0"/><path d="M25 55 Q50 85 75 55 Z" fill="#3E2723"/><circle cx="50" cy="45" r="22" fill="#FFF59D"/><path d="M35 40 Q50 30 65 40" stroke="#3E2723" stroke-width="4" fill="none"/></svg>`
            }
        ];

        let isSpinning = false;

        function recommendMenu() {
            if (isSpinning) return;
            isSpinning = true;

            const card = document.getElementById('result-card');
            const imgBox = document.getElementById('image-box');
            const menuName = document.getElementById('menu-name');
            const menuDesc = document.getElementById('menu-desc');

            card.classList.add('shake');

            let counter = 0;
            const maxCycles = 12;
            const interval = setInterval(() => {
                const randomIdx = Math.floor(Math.random() * menuList.length);
                const item = menuList[randomIdx];
                
                imgBox.innerHTML = item.svg;
                menuName.textContent = item.name;
                menuDesc.textContent = item.desc;
                
                counter++;
                if (counter >= maxCycles) {
                    clearInterval(interval);
                    card.classList.remove('shake');
                    isSpinning = false;
                }
            }, 80);
        }
    </script>
</body>
</html>
